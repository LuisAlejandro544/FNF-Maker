# Archivo: engine/crates/pulse_ui/Cargo.toml
# Propósito: Manifiesto de la interfaz gráfica y motor de juego en Rust (`eframe` + `egui`).
# Integra `pulse_core`, `pulse_audio` y `pulse_scripting` usando `tokio` para tareas
# asíncronas en segundo plano sin congelar la UI móvil.

[package]
name = "pulse_ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pulse_core.workspace = true
pulse_audio.workspace = true
pulse_scripting.workspace = true
eframe = { workspace = true, features = ["glow", "default_fonts"] }
egui.workspace = true
image.workspace = true
tokio.workspace = true
parking_lot.workspace = true
log.workspace = true
