# Archivo: engine/crates/pulse_android/Cargo.toml
# Propósito: Crate dinámico (`cdylib`) para Android que compila `libpulse_android.so`
# y expone mediante JNI todo el motor Rust (`pulse_core`, `pulse_audio`, `pulse_scripting`)
# hacia la interfaz móvil en Kotlin + Jetpack Compose (sin `eframe`, `winit` ni C++).

[package]
name = "pulse_android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pulse_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
pulse_core.workspace = true
pulse_audio.workspace = true
pulse_scripting.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
log.workspace = true
libc.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14.1"
jni = "0.21.1"
