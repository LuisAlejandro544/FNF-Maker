# Archivo: engine/crates/pulse_audio/Cargo.toml
# Propósito: Manifiesto del módulo de audio de baja latencia `pulse_audio` (100% Rust puro, sin C++).
# Usa enlaces dinámicos directos en Rust al C ABI de Android AAudio (`libaaudio.so` vía `dlopen`)
# y decodificadores 100% permisivos (lewton, hound, rmp3) para mezclar hasta 3 pistas.

[package]
name = "pulse_audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pulse_core.workspace = true
lewton.workspace = true
hound.workspace = true
rmp3.workspace = true
rayon.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
log.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
libc.workspace = true
