# Archivo: engine/Cargo.toml
# Propósito: Define el Workspace modular de Rust para BeatForge Studio.
# Centraliza las versiones de todas las dependencias (100% licencias permisivas MIT/Apache-2.0)
# para evitar conflictos entre crates y asegurar compatibilidad en Android 32-bit (armeabi-v7a)
# y 64-bit (arm64-v8a / x86_64).

[workspace]
resolver = "2"
members = [
    "crates/pulse_core",
    "crates/pulse_audio",
    "crates/pulse_scripting",
    "crates/pulse_android",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Audio de baja latencia 100% en Rust puro para Android via C ABI de AAudio (dlopen, cero C++)
libc = "0.2.172"

# Decodificadores de audio puros con licencias permisivas (sin MPL/GPL)
lewton = "0.10.2"   # OGG Vorbis (MIT / Apache-2.0)
hound = "3.5.1"     # WAV (Apache-2.0)
rmp3 = "0.3.1"      # MP3 (MIT)

# Motores de scripting: Lua 5.4 + TypeScript/JavaScript (MIT)
mlua = { version = "0.12.2", features = ["lua54", "vendored", "send", "serialize"] }
rquickjs = { version = "0.14.0", features = ["rust-alloc", "macro", "bindgen"] }
oxc_allocator = "0.158.0"
oxc_parser = "0.158.0"
oxc_transformer = "0.158.0"
oxc_codegen = "0.158.0"
oxc_span = "0.158.0"
oxc_semantic = "0.158.0"

# Procesamiento de XML Sparrow, imagenes, texturas .astc y skins SVG (MIT / Apache-2.0)
roxmltree = "0.21.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
texture2ddecoder = "0.1.2" # Decodificador ASTC 100% Rust puro (MIT OR Apache-2.0)
resvg = "0.50.0"

# Concurrencia, paralelismo en caliente y serializacion (MIT / Apache-2.0)
rayon = "1.12.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
log = "0.4.27"
parking_lot = "0.12.3"

# Utilidades internas entre modulos
pulse_core = { path = "crates/pulse_core" }
pulse_audio = { path = "crates/pulse_audio" }
pulse_scripting = { path = "crates/pulse_scripting" }

[profile.dev]
opt-level = 1
debug = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
