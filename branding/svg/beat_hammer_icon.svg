<?xml version="1.0" encoding="UTF-8"?>
<!--
  Archivo: branding/svg/beat_hammer_icon.svg
  Propósito: Logo maestro cuadrado (1024x1024) del "Beat Hammer" con colores llamativos
  para tiendas de apps (Uptodown, etc.) y exportación a iconos PNG clásicos.
-->
